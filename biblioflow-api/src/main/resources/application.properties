spring.application.name=biblioflow-api
server.port=8080

# MongoDB local (base de datos: biblioflow)
spring.data.mongodb.uri=mongodb://localhost:27017/biblioflow
spring.data.mongodb.auto-index-creation=true

# Fechas en formato ISO 8601 (2026-11-01T00:00:00Z)
spring.jackson.serialization.write-dates-as-timestamps=false
